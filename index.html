/* VOICE: energia de torcida da atlética, direto, feito pra conferir no celular
   IDEA: o quadro de chaves da AAIFEC pregado no mural do ginásio
   PICTURE: o castor biônico no topo; em cada modalidade, a chave ou a tabela grande logo abaixo do título
   COLOUR and TYPE: roxo da atlética dominante, roxo profundo de apoio, verde biônico pro destaque; Anton + Barlow
   LAYOUT: faixa roxa com o logo, trilho de modalidades, chave rolável na horizontal */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#110812);--panel:light-dark(#f6f1f7,#1c111e);--ink:light-dark(#170a18,#f1eaf2);--mut:light-dark(#6a5a6d,#ab9bb0);--line:light-dark(#e6dbe8,#3a283d);--blue:light-dark(#7a2584,#dba9e4);--deep:#2b0a2d;--lime:#8fd14f;--orange:#d2692b;--dark:#170a18}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Barlow,system-ui,sans-serif;overflow-x:clip}
body.adm{padding-bottom:84px}
.in{max-width:1240px;margin:0 auto;padding-inline:max(5vw,16px)}
.band{padding-block:clamp(28px,4vw,56px)}
.band.alt{background:var(--panel)}
.scroll{overflow-x:auto}.scroll a{flex:none}
h1,h2,.cn,.big,.champ strong,.pl{font-family:Anton,Impact,'Arial Narrow',sans-serif;font-weight:400}
h1{font-size:clamp(46px,9vw,92px);line-height:.95;margin:4px 0 10px;text-wrap:balance}
h2{font-size:clamp(32px,5vw,46px);line-height:1.05;margin:0 0 6px;text-wrap:balance}
h3{font-size:20px;margin:0 0 4px}
h4{font-size:14px;font-weight:600;color:var(--mut);margin:0 0 6px;height:22px;white-space:nowrap}
p{margin:0}
.top{background:radial-gradient(circle at 82% 45%,#a03fa8 0,#6c1f74 28%,#2b0a2d 78%);color:#fff;position:relative;overflow:hidden}
.top .in{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:20px}

.top .in{position:relative;padding-block:26px}
.kick{font-weight:700;font-size:18px}
.when{font-weight:500;max-width:36em}
.nav{background:var(--deep);color:#fff}
.nav .in{display:flex;gap:6px;padding-block:10px}
.nav a{color:#e9ebef;text-decoration:none;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;border-radius:999px;font-weight:600;white-space:nowrap}
.nav a:hover{background:#4a1a4f}
.nav a.on{background:var(--lime);color:var(--dark)}
@media(min-width:900px){.nav{position:sticky;top:0;z-index:5}}
button{font:600 16px Barlow,system-ui,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
button.pri{background:var(--ink);color:var(--bg)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top button{border-color:#fff;color:#fff;margin-top:16px}
.top button.on{background:var(--lime);border-color:var(--lime);color:var(--dark)}
.note{margin:0 0 18px;color:var(--mut);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px;margin-top:18px}
.card{display:grid;align-content:start;gap:2px;padding:20px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--blue)}
.gl{display:block;width:42px;height:42px;color:var(--blue);margin-bottom:8px;flex:none}.gl svg{width:100%;height:100%;display:block}
.cn{font-size:30px;line-height:1.05}
.cs{color:var(--mut)}
.pill{justify-self:start;margin:12px 0 4px;padding:3px 12px;border-radius:999px;font-size:14px;font-weight:600;background:var(--line);color:var(--ink)}
.pill.go{background:var(--blue);color:var(--bg)}
.pill.done{background:var(--lime);color:var(--dark)}
.cd{font-size:15px}
.next{margin-top:14px}
.nx{display:grid;grid-template-columns:minmax(0,13em) minmax(0,1fr) auto;gap:14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.nx .m{color:var(--mut);font-weight:600}.nx .r{color:var(--mut);font-size:14px;white-space:nowrap}
.nx a{color:inherit;font-weight:600;text-decoration:none}
@media(max-width:600px){.nx{grid-template-columns:minmax(0,1fr);gap:0}}
.mh{display:flex;gap:16px;align-items:center}
.sub{color:var(--mut)}
.info{margin-top:10px;font-weight:600}
.champ{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;background:var(--lime);color:var(--dark);padding:16px 22px;border-radius:16px;margin-top:20px}
.champ span{font-weight:700}
.champ strong{font-size:clamp(28px,5vw,44px);line-height:1.05}
.empty{margin-top:22px;padding:48px 24px;border:2px dashed var(--line);border-radius:16px;text-align:center}
.big{font-size:30px;line-height:1.1;margin-bottom:6px}
.empty p:last-child{color:var(--mut)}
.br{display:flex;margin-top:22px;padding-bottom:10px}
.col{display:flex;flex-direction:column;flex:none;width:270px}
.col.last{width:226px}
.ms{flex:1;display:flex;flex-direction:column}
.pair{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative;padding-right:28px}
.pair::after{content:'';position:absolute;right:14px;top:25%;bottom:25%;border-right:2px solid var(--line)}
.jn{position:absolute;right:0;top:50%;width:14px;border-top:2px solid var(--line)}

<script id="main">
{
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root = $('#root');
let saved = JSON.parse($('#state').textContent);
let S = structuredClone(saved);
let ART = null, admin = false, dirty = false, msg = '';
const BYE = {bye: true};

/* ---------- GitHub Pages ---------- */
// Se o site estiver num domínio próprio, preencha owner e repo abaixo.
const CONFIG = {owner: '', repo: '', branch: 'main', file: 'dados.json'};
const PAGES = !window.claude;
const gh = () => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i), seg = location.pathname.split('/').filter(Boolean)[0];
  return {owner: CONFIG.owner || (m ? m[1] : ''), repo: CONFIG.repo || (m ? (seg && !seg.includes('.') ? seg : m[1] + '.github.io') : '')};
};
let TOKEN = null, login = false, lmsg = '';
try { TOKEN = localStorage.getItem('saeng-gh-token'); } catch (e) {}
const api = (path, opt = {}) => fetch('https://api.github.com/repos/' + gh().owner + '/' + gh().repo + path,
  {...opt, cache: 'no-store', headers: {'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + TOKEN}});
const b64 = s => { const b = new TextEncoder().encode(s); let t = ''; for (let i = 0; i < b.length; i += 8192) t += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return btoa(t); };
async function ghLogin(tok) {
  TOKEN = tok;
  const r = await api('');
  if (!r.ok) throw new Error(String(r.status));
  const j = await r.json();
  if (!j.permissions || !j.permissions.push) throw new Error('perm');
  try { localStorage.setItem('saeng-gh-token', tok); } catch (e) {}
}
async function ghSave(st) {
  const p = '/contents/' + CONFIG.file;
  for (let k = 0; k < 3; k++) {
    const g = await api(p + '?ref=' + CONFIG.branch + '&t=' + Date.now());
    const sha = g.ok ? (await g.json()).sha : undefined;
    const r = await api(p, {method: 'PUT', body: JSON.stringify({message: 'Atualiza placares (' + fmtDate(st.upd) + ')', content: b64(JSON.stringify(st, null, 1)), sha, branch: CONFIG.branch})});
    if (r.ok) return;
    if (r.status !== 409 && r.status !== 422) throw new Error(String(r.status));
  }
  throw new Error('conflito');
}
async function loadData(first) {
  if (!PAGES) return;
  try {
    const r = await fetch(CONFIG.file + '?t=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return;
    const d = await r.json();
    if (first || (!dirty && (d.upd || '') > (S.upd || ''))) { saved = d; if (!dirty) S = structuredClone(d); render(); }
  } catch (e) {}
}
const isN = x => typeof x === 'string';

const HEAD = '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>Jogos internos SAENG</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">';
const buildDoc = st => '<!DOCTYPE html>\n<html lang="pt-BR">\n<head>\n' + HEAD + '\n<style id="css">' + $('#css').textContent + '</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="state">' + JSON.stringify(st).replace(/</g, '\\u003c') + '<\/script>\n<script id="main">' + $('#main').textContent + '<\/script>\n</body>\n</html>\n';

const GLYPH = {
  bola: '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 11l8 6-3 9h-10l-3-9z" fill="currentColor"/><path d="M20 11V4M28 17l7-3M25 26l4 7M15 26l-4 7M12 17l-7-3" stroke="currentColor" stroke-width="2.5"/></svg>',
  raquete: '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="currentColor"/><path d="M24 24l9 9" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="33" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>',
  cartas: '<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="9" width="18" height="26" rx="3" transform="rotate(-12 14 22)" fill="none" stroke="currentColor" stroke-width="3"/><rect x="16" y="5" width="18" height="26" rx="3" transform="rotate(10 25 18)" fill="currentColor"/></svg>',
  controle: '<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M11 11h18a9 9 0 0 1 9 9v5a6 6 0 0 1-11 3l-2-3H15l-2 3a6 6 0 0 1-11-3v-5a9 9 0 0 1 9-9z" fill="currentColor"/><path d="M11 16v7M7.5 19.5h7" stroke="var(--panel)" stroke-width="2.5"/><circle cx="28" cy="17" r="2.2" fill="var(--panel)"/><circle cx="31.5" cy="21.5" r="2.2" fill="var(--panel)"/></svg>',
  volei: '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="3"/><path d="M20 3c-5 7-5 14 0 17s13 3 17 1M20 20c-1 7-6 13-14 14M4 15c7-3 13-1 16 5" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>'
};

function seeds(n) { let o = [1, 2]; while (o.length < n) { const z = o.length * 2; o = o.flatMap(x => [x, z + 1 - x]); } return o; }
const rname = (B, r) => B.pre && r === 0 ? 'Preliminar' : roundName(B.R[r].length);
const realM = x => x.a !== BYE && x.b !== BYE;
function tbdFor(B, r, i) {
  if (!B.pre || r !== 1) return ['A definir', 'A definir'];
  const pre = B.R[0].filter(realM);
  return [B.R[0][2 * i], B.R[0][2 * i + 1]].map(s => realM(s) && !s.w ? 'Vencedor da preliminar' + (pre.length > 1 ? ' ' + (pre.indexOf(s) + 1) : '') : 'A definir');
}
const roundName = n => n === 1 ? 'Final' : n === 2 ? 'Semifinal' : n === 4 ? 'Quartas de final' : n === 8 ? 'Oitavas de final' : n === 16 ? 'Segunda fase' : 'Primeira fase';

function bracket(m) {
  const P = m.part; if (P.length < 2) return null;
  let z = 2; while (z < P.length) z *= 2;
  let slots = seeds(z).map(s => s <= P.length ? P[s - 1] : BYE);
  const R = []; let r = 0;
  while (slots.length > 1) {
    const ms = [], nx = [];
    for (let i = 0; i < slots.length; i += 2) {
      const a = slots[i], b = slots[i + 1], id = r + '-' + (i / 2), x = m.res[id];
      const ok = x && x.a === a && x.b === b, sa = ok ? x.sa : null, sb = ok ? x.sb : null, sets = ok ? x.sets || null : null;
      let w = null;
      if (a === BYE && isN(b)) w = b; else if (b === BYE && isN(a)) w = a;
      else if (isN(a) && isN(b) && sa != null && sb != null && sa !== sb) w = sa > sb ? a : b;
      ms.push({id, a, b, sa, sb, sets, w, tie: sa != null && sb != null && sa === sb, dom: m.id + '-' + id});
      nx.push(w);
    }
    R.push(ms); slots = nx; r++;
  }
  const nb = R[0].filter(x => x.a === BYE || x.b === BYE).length;
  return {R, champ: R[R.length - 1][0].w, pre: nb > R[0].length - nb};
}

function league(m) {
  const T = m.part; if (T.length < 2) return null;
  let plan = [];
  if (m.ciclo && T.length >= 3) {
    const n = T.length, gs = T.map((t, i) => [t, T[(i + 1) % n]]);
    const order = [...gs.filter((_, i) => i % 2 === 0), ...gs.filter((_, i) => i % 2 === 1)];
    for (const g of order) {
      let rd = plan.find(r => r.length < Math.floor(n / 2) && !r.some(x => x.includes(g[0]) || x.includes(g[1])));
      if (!rd) { rd = []; plan.push(rd); }
      rd.push(g);
    }
  } else {
    const arr0 = T.slice(); if (arr0.length % 2) arr0.push(null);
    const n = arr0.length; let arr = arr0;
    for (let r = 0; r < n - 1; r++) {
      const rd = [];
      for (let i = 0; i < n / 2; i++) {
        const p = arr[i], q = arr[n - 1 - i];
        if (p !== null && q !== null) rd.push((r % 2 && i === 0) ? [q, p] : [p, q]);
      }
      plan.push(rd); arr = [arr[0], arr[n - 1], ...arr.slice(1, n - 1)];
    }
  }
  const rounds = plan.map((rd, r) => ({
    bye: T.filter(t => !rd.some(x => x.includes(t))),
    games: rd.map(([a, b], i) => {
      const id = a + '|' + b, x = m.res[id], sa = x ? x.sa : null, sb = x ? x.sb : null, done = sa != null && sb != null;
      return {id, a, b, sa, sb, sets: x ? x.sets || null : null, done, w: done ? (sa > sb ? a : sb > sa ? b : 'E') : null, dom: m.id + '-' + r + '-' + i};
    })
  }));
  const tab = Object.fromEntries(T.map(t => [t, {t, J: 0, V: 0, E: 0, D: 0, GP: 0, GC: 0, PP: 0, PC: 0}]));
  const all = rounds.flatMap(r => r.games);
  for (const g of all) if (g.done) {
    const A = tab[g.a], B = tab[g.b];
    A.J++; B.J++; A.GP += g.sa; A.GC += g.sb; B.GP += g.sb; B.GC += g.sa;
    if (g.sa > g.sb) { A.V++; B.D++; } else if (g.sb > g.sa) { B.V++; A.D++; } else { A.E++; B.E++; }
    for (const s of g.sets || []) if (s && s[0] != null && s[1] != null) { A.PP += s[0]; A.PC += s[1]; B.PP += s[1]; B.PC += s[0]; }
  }
  const table = Object.values(tab).map(x => ({...x, P: x.V * 3 + x.E, SG: x.GP - x.GC, PS: x.PP - x.PC}))
    .sort((x, y) => y.P - x.P || y.V - x.V || y.SG - x.SG || y.GP - x.GP || y.PS - x.PS || x.t.localeCompare(y.t));
  const played = all.filter(g => g.done).length, total = all.length, closed = played === total;
  let fin = null, champ = null;
  if (m.final) {
    const a = closed ? table[0].t : null, b = closed ? table[1].t : null, x = m.res.final;
    const ok = a && x && x.a === a && x.b === b;
    fin = {id: 'final', a, b, sa: ok ? x.sa : null, sb: ok ? x.sb : null, pa: ok ? x.pa : null, pb: ok ? x.pb : null, dom: m.id + '-final'};
    fin.tie = fin.sa != null && fin.sb != null && fin.sa === fin.sb;
    fin.w = !a ? null : (fin.sa != null && fin.sb != null && fin.sa !== fin.sb) ? (fin.sa > fin.sb ? a : b)
      : (fin.tie && fin.pa != null && fin.pb != null && fin.pa !== fin.pb) ? (fin.pa > fin.pb ? a : b) : null;
    champ = fin.w;
  } else if (closed) champ = table[0].t;
  return {rounds, table, played, total, closed, fin, champ};
}

function info(m) {
  if (m.tipo === 'liga') {
    const L = league(m);
    if (!L) return {L, st: ['Aguardando inscritos', ''], det: '', pend: []};
    if (L.champ) return {L, st: ['Encerrado', 'done'], det: 'Campeão: ' + L.champ, pend: []};
    if (L.closed && L.fin) return {L, st: ['Final', 'go'], det: 'Final: ' + L.fin.a + ' × ' + L.fin.b, pend: [{a: L.fin.a, b: L.fin.b, r: 'Final'}]};
    const rd = L.rounds.findIndex(r => r.games.some(g => !g.done));
    const pend = L.rounds[rd].games.filter(g => !g.done).map(g => ({a: g.a, b: g.b, r: 'Rodada ' + (rd + 1)}));
    return {L, st: [L.played ? 'Em andamento' : 'Tabela pronta', 'go'], det: L.played ? 'Líder: ' + L.table[0].t : 'Próximo: ' + pend[0].a + ' × ' + pend[0].b, pend};
  }
  const B = bracket(m);
  if (!B) return {B, st: ['Aguardando inscritos', ''], det: '', pend: []};
  let pend = [];
  for (const [ri, ms] of B.R.entries()) { const p = ms.filter(x => isN(x.a) && isN(x.b) && !x.w); if (p.length) { pend = p.map(x => ({a: x.a, b: x.b, r: rname(B, ri)})); break; } }
  if (B.champ) return {B, st: ['Encerrado', 'done'], det: 'Campeão: ' + B.champ, pend};
  const any = B.R.flat().some(x => x.sa != null);
  return {B, st: [any ? 'Em andamento' : 'Chave pronta', 'go'], det: pend[0] ? 'Próximo: ' + pend[0].a + ' × ' + pend[0].b : '', pend};
}

const fmtDate = s => new Date(s).toLocaleString('pt-BR', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'});
const route = () => { const h = location.hash.slice(1); return S.mods.some(m => m.id === h) ? h : 'inicio'; };

function header(r) {
  const links = [['inicio', 'Visão geral'], ...S.mods.map(m => [m.id, m.tag])];
  return `<header class="top"><div class="in"><div><p class="kick">${esc(S.evento)}</p><h1>Jogos internos</h1>
  <p class="when">${S.upd ? 'Chaves, tabelas e resultados · atualizado em ' + esc(fmtDate(S.upd)) : 'Chaves, tabelas e resultados de todas as modalidades'}</p>
  ${ART || (PAGES && TOKEN) ? `<button class="${admin ? 'on' : ''}" data-act="admin">${admin ? 'Sair do modo organizador' : 'Modo organizador'}</button>` : ''}</div><div class="logo" role="img" aria-label="Logo da AAIFEC Biônicos"></div></div></header>
  <nav class="nav" aria-label="Modalidades"><div class="in scroll">${links.map(([id, t]) => `<a href="#${id}" class="${r === id ? 'on' : ''}">${esc(t)}</a>`).join('')}</div></nav>`;
}

function home() {
  const I = S.mods.map(m => [m, info(m)]);
  const next = I.flatMap(([m, x]) => x.pend.map(p => ({...p, m}))).slice(0, 12);
  return `<section class="band"><div class="in"><h2>Modalidades</h2>${S.aviso ? `<p class="note">${esc(S.aviso)}</p>` : ''}
  <div class="cards">${I.map(([m, x]) => `<a class="card" href="#${m.id}"><span class="gl">${GLYPH[m.icon]}</span><span class="cn">${esc(m.nome)}</span>
  <span class="cs">${esc(m.sub)} · ${m.tipo === 'liga' ? (m.final ? '2 jogos por time + final' : 'todos contra todos') : 'mata-mata'}${m.part.length ? ' · ' + m.part.length + (m.sub === 'Duplas' ? ' duplas' : m.sub === 'Times' ? ' times' : ' inscritos') : ''}</span>

const scoreIn = (m, g, side, dom) => `<input class="in-sc" type="number" min="0" inputmode="numeric" id="s-${dom}-${side}" data-act="sc" data-mod="${m.id}" data-id="${esc(g.id)}" data-a="${esc(g.a)}" data-b="${esc(g.b)}" data-side="${side}" value="${g[side] ?? ''}" aria-label="Placar de ${esc(side === 'sa' ? g.a : g.b)}">`;

function drawLiga(m, Lg, logo) {
  const [c, x] = sheet(210, 297), W = c.width, L = 12 * K, cx = W / 2, bs = 9.5 * K, rh = 11 * K;
  head(x, W, logo, m);
  let y = 45 * K;
  const h2 = t => { x.textAlign = 'left'; x.fillStyle = PC.pur; x.font = PF(400, 6.5 * K, 'A'); x.fillText(t, L, y); y += 8 * K; };
  const game = (a, b, sa, sb, ca, cb, wa, wb) => {
    const cy = y + rh / 2, nw = cx - bs - 8 * K - L;
    sq(x, cx - bs - 3 * K, cy - bs / 2, bs, sa); sq(x, cx + 3 * K, cy - bs / 2, bs, sb);
    x.fillStyle = PC.mut; x.font = PF(600, 4 * K, 'B'); x.textAlign = 'center'; x.fillText('×', cx, cy);
    [[a, ca, cx - bs - 7 * K, 'right', wa], [b, cb, cx + bs + 7 * K, 'left', wb]].forEach(([n, cap, xp, al, w]) => {
      if (n) nameCell(x, n, xp, cy, nw, al, w);
      else { ln(x, al === 'right' ? L : xp, cy + 3 * K, al === 'right' ? xp : W - L, cy + 3 * K, .3, PC.line); x.fillStyle = PC.mut; x.font = PF('italic 400', 3.6 * K, 'B'); x.textAlign = al; x.fillText(cap, xp, cy - 1 * K); }
    });
    y += rh + 1.5 * K;
  };
  const setGame = g => {
    const bs = 8 * K, gb = 2.5 * K, nc = m.sets + 1, bx0 = W - L - nc * (bs + gb) + gb;
    x.fillStyle = PC.mut; x.font = PF(600, 3.2 * K, 'B'); x.textAlign = 'center';
    for (let i = 0; i < nc; i++) x.fillText(i < m.sets ? `${i + 1}º set` : 'Sets', bx0 + i * (bs + gb) + bs / 2, y + 1.5 * K);
    y += 4.5 * K;
    [[g.a, 0, 'sa'], [g.b, 1, 'sb']].forEach(([n, p, side]) => {
      const cy = y + bs / 2;
      nameCell(x, n, L + 2 * K, cy, bx0 - L - 8 * K, 'left', g.w === n);
      for (let i = 0; i < m.sets; i++) { const s = g.sets && g.sets[i]; sq(x, bx0 + i * (bs + gb), cy - bs / 2, bs, s ? s[p] : null); }
      x.lineWidth = .7 * K; x.strokeStyle = PC.ink; const tx = bx0 + m.sets * (bs + gb); x.strokeRect(tx, cy - bs / 2, bs, bs); sq(x, tx, cy - bs / 2, bs, g[side]);
      y += bs + 1.5 * K;
    });
    ln(x, L, y + .5 * K, W - L, y + .5 * K, .25, PC.line); y += 3.5 * K;
  };
  h2(m.final ? 'Primeira fase · 2 jogos por time' : 'Jogos');
  if (m.sets) { drawT(x, setRule(m)[0].toUpperCase() + setRule(m).slice(1) + '. Anote os pontos de cada set; em "Sets", quantos cada um venceu.', L, y - 2 * K, W - 2 * L, 3.6 * K, 2.8 * K, 500, 'B', 'left', PC.mut, 1); y += 4 * K; }
  Lg.rounds.forEach((rd, i) => {
    x.textAlign = 'left'; x.fillStyle = PC.mut; x.font = PF(700, 3.7 * K, 'B');
    x.fillText(`Rodada ${i + 1}` + (rd.bye.length ? `   ·   folga: ${rd.bye.join(', ')}` : ''), L, y); y += 5 * K;
    rd.games.forEach(g => m.sets ? setGame(g) : game(g.a, g.b, g.sa, g.sb, '', '', g.w === g.a, g.w === g.b));
    y += 2 * K;
  });
  y += 2 * K; h2('Classificação');
  const lb = lab(m), cols = lb.c, tw = 72 * K, cw = (W - 2 * L - tw) / cols.length, th = 8.5 * K;
  const rows = Lg.played ? Lg.table : m.part.map(t => ({t}));
  x.font = PF(700, 3.7 * K, 'B'); x.fillStyle = PC.mut; x.textAlign = 'left'; x.fillText(who(m), L + 2 * K, y + th / 2);
  x.textAlign = 'center'; cols.forEach(([t], i) => x.fillText(t, L + tw + cw * (i + .5), y + th / 2));
  ln(x, L, y + th, W - L, y + th, .5); y += th;
  rows.forEach((r, ri) => {
    const cy = y + th / 2;
    drawT(x, (ri + 1) + '. ' + r.t, L + 2 * K, cy, tw - 4 * K, 4.4 * K, 3.2 * K, 600, 'B', 'left', PC.ink, 1);
    if (Lg.played) cols.forEach(([, k], i) => { x.font = PF(500, 4.2 * K, 'B'); x.fillStyle = PC.ink; x.textAlign = 'center'; x.fillText(cell(r, k), L + tw + cw * (i + .5), cy); });
    y += th; ln(x, L, y, W - L, y, .25, PC.line);
  });
  cols.forEach((_, i) => ln(x, L + tw + cw * i, y - th * (rows.length + 1), L + tw + cw * i, y, .25, PC.line));
  if (!lb.e) { x.fillStyle = PC.mut; x.font = PF(500, 3.4 * K, 'B'); x.textAlign = 'left'; drawT(x, 'SP = ' + lb.u + ' a favor · SC = ' + lb.u + ' contra · SS = saldo' + (m.sets ? ' · ±Pts = saldo de pontos' : '') + ' · vitória vale 3 · desempate: vitórias, SS, SP' + (m.sets ? ', ±Pts' : ''), L, y + 5 * K, W - 2 * L, 3.4 * K, 2.6 * K, 500, 'B', 'left', PC.mut, 1); y += 10 * K; }
  if (m.final && Lg.fin) {
    y += 7 * K; h2('Final · 1º × 2º');
    const f = Lg.fin; game(f.a, f.b, f.sa, f.sb, '1º colocado', '2º colocado', f.w && f.w === f.a, f.w && f.w === f.b);
    const ps = 7 * K, cy = y + ps / 2;
    x.fillStyle = PC.mut; x.font = PF(600, 3.6 * K, 'B'); x.textAlign = 'right'; x.fillText('Pênaltis (se empatar)', cx - ps - 6 * K, cy);
    sq(x, cx - ps - 3 * K, y, ps, f.tie ? f.pa : null); sq(x, cx + 3 * K, y, ps, f.tie ? f.pb : null);
    y += ps + 6 * K;
  }
  const cy = Math.min(y + 8 * K, 280 * K);
  x.fillStyle = PC.lime; x.fillRect(L, cy - 8 * K, W - 2 * L, 16 * K);
  x.textAlign = 'left'; x.fillStyle = PC.ink; x.font = PF(400, 6.5 * K, 'A'); x.fillText('Campeão', L + 4 * K, cy);
  if (Lg.champ) drawT(x, Lg.champ, L + 34 * K, cy, W - 2 * L - 38 * K, 6 * K, 4 * K, 700, 'B', 'left', PC.ink, 1);
  else ln(x, L + 34 * K, cy + 4 * K, W - L - 4 * K, cy + 4 * K, .3);
  return [c, 'p'];
}
function drawFolha(x, oy, m, logo) {
  const W = 210 * K, H = 148.5 * K, I = info(m), champ = (I.B && I.B.champ) || (I.L && I.L.champ) || '';
  x.strokeStyle = PC.pur; x.lineWidth = 1.8 * K; x.strokeRect(9 * K, oy + 9 * K, W - 18 * K, H - 18 * K);
  x.lineWidth = .4 * K; x.strokeRect(11.8 * K, oy + 11.8 * K, W - 23.6 * K, H - 23.6 * K);
  const lh = 86 * K, lw = lh * 420 / 449; x.drawImage(logo, 16 * K, oy + (H - lh) / 2, lw, lh);
  const X0 = 16 * K + lw + 8 * K, X1 = W - 18 * K, bw = X1 - X0;
  drawT(x, 'SAENG · Jogos internos · AAIFEC Biônicos', X0, oy + 22 * K, bw, 4.2 * K, 3 * K, 700, 'B', 'left', PC.mut, 1);

  const mt = fullName(m);
  const r = fitT(x, mt, bw - 6 * K, 7.5 * K, 4.5 * K, 400, 'A', 1); x.font = PF(400, r.s, 'A');
  const tw = x.measureText(r.l[0]).width + 6 * K;
  x.save(); x.translate(X0, oy + 70 * K); x.rotate(-.025); x.fillStyle = PC.lime; x.fillRect(-1 * K, -r.s * .85, tw, r.s * 1.7); x.restore();
  x.fillStyle = PC.ink; x.textAlign = 'left'; x.fillText(r.l[0], X0 + 2 * K, oy + 70 * K);
  const ny = oy + 91 * K;
  if (champ) drawT(x, champ, X0, ny, bw, 9 * K, 5 * K, 700, 'B', 'left', PC.ink, 2);
  ln(x, X0, ny + 11 * K, X1, ny + 11 * K, .35);
  x.fillStyle = PC.mut; x.font = PF(500, 3.4 * K, 'B'); x.textAlign = 'left';
  x.fillText(m.sub === 'Duplas' ? 'dupla' : m.sub === 'Times' ? 'time' : 'nome', X0, ny + 15 * K);
  const by = oy + H - 25 * K;
  x.fillStyle = PC.ink; x.font = PF(600, 3.8 * K, 'B'); x.fillText('Data: ____/____/2026', X0, by);
  ln(x, X0 + bw * .52, by + 2 * K, X1, by + 2 * K, .35);
  x.fillStyle = PC.mut; x.font = PF(500, 3.4 * K, 'B'); x.textAlign = 'center'; x.fillText('organização', X0 + bw * .76, by + 6 * K);

async function makePDF(kind, ids) {
  if (busy || !DL) return;
  busy = true; pmsg = 'Gerando PDF…'; render();
  try {
    await loadJsPDF();
    await Promise.all(['400 40px Anton', '500 30px Barlow', '600 30px Barlow', '700 30px Barlow', 'italic 400 30px Barlow'].map(f => document.fonts.load(f).catch(() => {})));
    const logo = await logoImg(), {jsPDF} = window.jspdf; let pdf = null;
    const add = (c, o) => {
      const land = o === 'l';
      if (!pdf) pdf = new jsPDF({orientation: land ? 'landscape' : 'portrait', unit: 'mm', format: 'a4', compress: true});
      else pdf.addPage('a4', land ? 'landscape' : 'portrait');
      pdf.addImage(c.toDataURL('image/jpeg', .9), 'JPEG', 0, 0, land ? 297 : 210, land ? 210 : 297, undefined, 'FAST');
    };
    const mods = S.mods.filter(m => ids.includes(m.id) && m.part.length >= 2);
    if (!mods.length) throw {code: 'vazio'};
    if (kind === 'sumula') for (const m of mods) { const I = info(m); const [c, o] = m.tipo === 'liga' ? drawLiga(m, I.L, logo) : drawBracket(m, I.B, logo); add(c, o); }
    else for (let i = 0; i < mods.length; i += 2) {
      const [c, x] = sheet(210, 297); drawFolha(x, 0, mods[i], logo);
      if (mods[i + 1]) drawFolha(x, 148.5 * K, mods[i + 1], logo);
      x.setLineDash([3 * K, 2.5 * K]); ln(x, 0, 148.5 * K, c.width, 148.5 * K, .3, PC.line); x.setLineDash([]);
      x.fillStyle = PC.mut; x.font = PF(500, 3 * K, 'B'); x.textAlign = 'left'; x.fillText('recorte aqui', 4 * K, 146 * K);
      add(c, 'p');
    }
    const fn = (kind === 'sumula' ? 'sumulas-saeng' : 'folhinhas-campeao-saeng') + (ids.length === 1 ? '-' + ids[0] : '') + '.pdf';
    await DL.save({filename: fn, data: pdf.output('blob')});
    pmsg = 'PDF salvo.';
  } catch (e) {
    const c = e && e.code;
    pmsg = c === 'declined' ? 'Download cancelado.' : c === 'vazio' ? 'Essa modalidade ainda não tem inscritos.'
      : c === 'host_unavailable' ? 'Este app não salva arquivos; abra o site no navegador ou no computador.'
      : c === 'rate_limited' ? 'Já tem um download em andamento; tente de novo em instantes.' : 'Não deu para gerar o PDF.';
    if (['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(c)) DL = null;
  }
  busy = false; render();
}
const prtBtns = (ids, one) => !DL || (PAGES && !admin) ? '' : `<div class="prt"><button data-act="pdf" data-kind="sumula" data-ids="${ids}" ${busy ? 'disabled' : ''}>${one ? 'Súmula para imprimir' : 'Súmulas e chaves (PDF)'}</button>
  <button data-act="pdf" data-kind="folha" data-ids="${ids}" ${busy ? 'disabled' : ''}>${one ? 'Folhinha do campeão' : 'Folhinhas de campeão (PDF)'}</button>${pmsg ? `<span class="pm">${esc(pmsg)}</span>` : ''}</div>`;

const bar = () => !admin ? '' : `<div class="bar"><div class="in"><span>${dirty ? 'Alterações não salvas' : 'Tudo publicado'}${msg ? ' · ' + esc(msg) : ''}</span>
  <button data-act="discard" ${dirty ? '' : 'disabled'}>Descartar</button><button class="pri" data-act="save" ${dirty ? '' : 'disabled'}>Salvar e publicar</button></div></div>`;

function render() {
  const act = document.activeElement && document.activeElement.id;
  const r = route(), m = S.mods.find(x => x.id === r);
  const lg = !login ? '' : `<section class="band"><div class="in"><div class="ed" style="margin-top:0"><h3>Entrar como organizador</h3>
  <label for="tok">Chave de acesso do GitHub</label><input id="tok" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…">
  <div class="btns"><button class="pri" data-act="login">Entrar</button><button data-act="nologin">Cancelar</button></div>
  <p class="hint">${lmsg ? esc(lmsg) : 'Só quem tem a chave do repositório consegue lançar placares. A chave fica guardada apenas neste navegador.'}</p></div></div></section>`;
  const ft = `<footer class="foot"><div class="in"><span>SAENG · AAIFEC Biônicos</span>${PAGES && !TOKEN && !login ? '<button class="lnk" data-act="showlogin">Área do organizador</button>' : ''}${PAGES && TOKEN ? '<button class="lnk" data-act="logout">Esquecer minha chave neste navegador</button>' : ''}</div></footer>`;
  root.innerHTML = header(r) + lg + (m ? modPage(m) : home()) + ft + bar();
  document.body.classList.toggle('adm', admin);
  if (act) { const e = document.getElementById(act); if (e) e.focus(); }
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

async function save() {
  if (PAGES) {
    if (!TOKEN) return;
    const st = structuredClone(S); st.upd = new Date().toISOString();
    msg = 'Publicando…'; render();
    try { await ghSave(st); S = st; saved = structuredClone(st); dirty = false; msg = 'Publicado. Em cerca de 1 minuto aparece para todo mundo.'; }
    catch (e) {
      const t = e.message;
      if (t === '401') { msg = 'A chave expirou ou foi apagada. Entre de novo.'; TOKEN = null; admin = false; try { localStorage.removeItem('saeng-gh-token'); } catch (x) {} }
      else msg = t === '403' || t === '404' ? 'A chave não tem permissão de escrita neste repositório.' : 'Não deu para publicar (' + t + '). Tente de novo.';
    }
    render(); return;
  }
  if (!ART) return;
  const st = structuredClone(S); st.upd = new Date().toISOString();
  msg = 'Publicando…'; render();
  try { await ART.publish(buildDoc(st)); S = st; dirty = false; msg = 'Publicado'; }
  catch (e) {
    const t = String((e && (e.code || e.message)) || e);
    if (/not_granted|not_writer/.test(t)) { ART = null; admin = false; msg = ''; }
    else if (/conflict/.test(t)) msg = 'Outra pessoa salvou antes; a página vai recarregar';
    else msg = 'Não deu para publicar (' + t + ')';
  }
  render();
}

root.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, m = S.mods.find(x => x.id === t.dataset.mod);
  if (a === 'admin') { admin = !admin; msg = ''; render(); }
  else if (a === 'showlogin') { login = true; lmsg = ''; render(); scrollTo(0, 0); const i = $('#tok'); if (i) i.focus(); }
  else if (a === 'nologin') { login = false; render(); }
  else if (a === 'login') {
    const tok = ($('#tok').value || '').trim(); if (!tok) return;
    lmsg = 'Conferindo a chave…'; t.disabled = true; render();
    ghLogin(tok).then(() => { login = false; admin = true; msg = ''; render(); })
      .catch(e => { TOKEN = null; lmsg = e.message === 'perm' ? 'Essa chave não tem permissão de escrita neste repositório.' : e.message === '401' ? 'Chave inválida ou expirada.' : e.message === '404' ? 'Não achei o repositório ' + gh().owner + '/' + gh().repo + ' com essa chave. Confira se a chave dá acesso a ele.' : 'Não deu para conferir a chave (' + e.message + ').'; render(); });
  }
  else if (a === 'logout') { if (dirty) { msg = 'Salve ou descarte as alterações antes.'; render(); return; } TOKEN = null; admin = false; try { localStorage.removeItem('saeng-gh-token'); } catch (x) {} render(); }
  else if ((a === 'apply' || a === 'draw') && m) {
    const L = [...new Set($('#p-' + m.id).value.split('\n').map(s => s.trim()).filter(Boolean))];
    m.part = a === 'draw' ? shuffle(L) : L; dirty = true; msg = ''; render();
  }
  else if (a === 'discard') { S = structuredClone(saved); dirty = false; msg = ''; render(); }
  else if (a === 'save') save();
  else if (a === 'pdf') makePDF(t.dataset.kind, t.dataset.ids === 'all' ? S.mods.map(x => x.id) : [t.dataset.ids]);
});
root.addEventListener('change', e => {
  const t = e.target, m = S.mods.find(x => x.id === t.dataset.mod); if (!m) return;
  if (t.dataset.act === 'info') { m.info = t.value.trim(); }
  else if (t.dataset.act === 'set') {
    const {id, a, b} = t.dataset, i = +t.dataset.set, p = +t.dataset.p, v = t.value === '' ? null : Math.max(0, parseInt(t.value, 10) || 0);
    const old = m.res[id], r = old && old.a === a && old.b === b ? {...old} : {a, b, sa: null, sb: null};
    r.sets = (r.sets || []).map(s => s.slice()); while (r.sets.length < m.sets) r.sets.push([null, null]);
    r.sets[i][p] = v; [r.sa, r.sb] = setsCalc(m, r.sets); m.res[id] = r;
  }
  else if (t.dataset.act === 'sc') {
    const {id, a, b, side} = t.dataset, v = t.value === '' ? null : Math.max(0, parseInt(t.value, 10) || 0);
    const old = m.res[id], r = old && old.a === a && old.b === b ? old : {a, b, sa: null, sb: null};
    r[side] = v; m.res[id] = r;
  } else return;
  dirty = true; msg = ''; setTimeout(render, 0);
});
root.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'tok') { const b = root.querySelector('[data-act="login"]'); if (b) b.click(); } });
root.addEventListener('focusin', e => { if (e.target.classList.contains('in-sc')) e.target.select(); });
addEventListener('hashchange', () => { render(); scrollTo(0, 0); });

if (PAGES) {
  DL = {save: async ({filename, data}) => { const u = URL.createObjectURL(data), l = document.createElement('a'); l.href = u; l.download = filename; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 10000); return {status: 'saved'}; }};
  loadData(true);
  setInterval(() => { if (!dirty && !document.hidden) loadData(false); }, 60000);
  addEventListener('visibilitychange', () => { if (!document.hidden && !dirty) loadData(false); });
}
render();
if (window.claude && typeof claude.use === 'function') {
  claude.use('artifact').then(x => { if (x) { ART = x; render(); } }).catch(() => {});
  claude.use('downloads').then(x => { if (x) { DL = x; render(); } }).catch(() => {});
}
}
